name: CentralDark pairing web
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/centraldark-pairing-web.yml'
  push:
    branches: [main, 'centraldark/remote-pairing-web']
    paths:
      - 'web/**'
      - '.github/workflows/centraldark-pairing-web.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Upload verified React build
        uses: actions/upload-artifact@v4
        with:
          name: centraldark-pairing-web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
