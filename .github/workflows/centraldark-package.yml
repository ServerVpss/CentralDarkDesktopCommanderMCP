name: CentralDark remote package
on:
  pull_request:
    paths:
      - 'centraldark/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/centraldark-package.yml'
  push:
    branches: [main, 'centraldark/remote-pairing-web']
    paths:
      - 'centraldark/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/centraldark-package.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:centraldark
      - run: npm run start:centraldark -- remote --help
